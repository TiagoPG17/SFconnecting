server {
    listen 80;
    server_name _;
    root /var/www/sfconnecting/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Bloquear extensiones que nunca deberían servirse desde public/,
    # aunque un archivo de este tipo caiga aquí por accidente.
    location ~* \.(sql|env|log|lock|sqlite|bak|backup)$ {
        deny all;
    }
}
