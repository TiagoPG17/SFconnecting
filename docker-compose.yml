services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sfconnecting-app
    restart: unless-stopped
    working_dir: /var/www/sfconnecting
    volumes:
      - ./.env:/var/www/sfconnecting/.env
      - sfconnecting_storage:/var/www/sfconnecting/storage
      - sfconnecting_public:/mnt/sfconnecting-public
    networks:
      - sfconnecting-network
    depends_on:
      - db

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sfconnecting-queue
    restart: unless-stopped
    working_dir: /var/www/sfconnecting
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    volumes:
      - ./.env:/var/www/sfconnecting/.env
      - sfconnecting_storage:/var/www/sfconnecting/storage
    networks:
      - sfconnecting-network
    depends_on:
      - db

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sfconnecting-scheduler
    restart: unless-stopped
    working_dir: /var/www/sfconnecting
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    volumes:
      - ./.env:/var/www/sfconnecting/.env
      - sfconnecting_storage:/var/www/sfconnecting/storage
    networks:
      - sfconnecting-network
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: sfconnecting-redis
    restart: unless-stopped
    networks:
      - sfconnecting-network

  nginx:
    image: nginx:alpine
    container_name: sfconnecting-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - sfconnecting_public:/var/www/sfconnecting/public:ro
    networks:
      - sfconnecting-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sfconnecting-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: sfconnecting
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: sfconnecting
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sfconnecting_db:/var/lib/mysql
    networks:
      - sfconnecting-network

networks:
  sfconnecting-network:
    driver: bridge

volumes:
  sfconnecting_storage:
  sfconnecting_db:
  sfconnecting_public:
