services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sfconnecting-app
    restart: unless-stopped
    working_dir: /var/www/sfconnecting
    volumes:
      - sfconnecting_storage:/var/www/sfconnecting/storage
      - ./.env:/var/www/sfconnecting/.env
      - sfconnecting_public:/var/www/sfconnecting/public
      - ./config:/var/www/sfconnecting/config
      - ./resources:/var/www/sfconnecting/resources
      - ./routes:/var/www/sfconnecting/routes
      - ./app:/var/www/sfconnecting/app
    networks:
      - sfconnecting-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: sfconnecting-nginx
    restart: unless-stopped
    ports:
      - "8080:80"   # Cambia 8080 si ese puerto está ocupado en el servidor
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - sfconnecting_public:/var/www/sfconnecting/public:ro
    networks:
      - sfconnecting-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sfconnecting-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: sfconnecting
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: sfconnecting
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sfconnecting_db:/var/lib/mysql
    networks:
      - sfconnecting-network

networks:
  sfconnecting-network:
    driver: bridge

volumes:
  sfconnecting_storage:
  sfconnecting_db:
  sfconnecting_public:
